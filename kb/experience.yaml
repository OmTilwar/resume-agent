# Kit §5 — Research Intern. All facts are ⚠ (candidate-stated).
titles: ["Research Intern", "Machine Learning Research Intern"]
org: "IIIT"
location: "Nagpur, Maharashtra"
dates: "August 2025 -- February 2026"

