        fact_ids: [ex_edge]
      - id: A4
        text: "Deployed the model on a Linux edge device (Raspberry Pi 5B + Hailo-8), handling dependency setup and performance profiling to hold inference under 30ms."
        fact_ids: [ex_edge]
  - id: B
