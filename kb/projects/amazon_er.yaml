bullets:
  - id: amz_b1
    text: "Built a business entity-resolution pipeline matching 10M noisy multilingual records (US/India/France) to 1.7M reference entities, ranking 724th on the Amazon ML Challenge 2026 public leaderboard (0.9837 macro F0.5)."
    fact_ids: [amz_scale, amz_lb_f05, amz_rank]
  - id: amz_b2
    text: "Fine-tuned a multilingual-e5-base bi-encoder on 3M pairs with in-batch negatives, raising blocking recall from 98.29% to 99.31%; a LightGBM ranker (~40 features) cut candidates to 29.9M, kept 99.89% of true pairs."
    fact_ids: [amz_blocking, amz_stage1]
  - id: amz_b3
    text: "Ensembled 4 fine-tuned cross-encoders (bge-reranker-v2-m3, mDeBERTa-v3) with a cross-fitted LightGBM stacker and query-level gate, lifting leaderboard F0.5 from 0.894 to 0.9837 across 18 iterations."
    fact_ids: [amz_cross_enc, amz_progression]
  - id: amz_b4
    text: "Designed orphan simulation (removing 25% of reference entities from validation folds) to reproduce the test set's distractor rate, closing the val–test gap and delivering the largest single gain (+0.0043 F0.5)."
    fact_ids: [amz_orphan]
  - id: amz_b5
    text: "Adapted models to an unlabeled country (France) via 3 rounds of self-training on high-confidence pseudo-labels with multi-model agreement, cutting uncertain records from 7.2% to 4.9%."
    fact_ids: [amz_france]
  - id: amz_b6
    text: "Built country-agnostic normalization (NFKC, Devanagari/Kannada transliteration, legal-suffix canonicalization, alias splitting) for names where only 10.7% of true matches were string-equal."
    fact_ids: [amz_string_equal]
  - id: amz_b7
    text: "Built a precision-first decision layer from train audits — per-country budgets, per-entity caps and ambiguity drops that removed 6,890 risky merges — under an F0.5 metric weighting precision 2x."
    fact_ids: [amz_decision]
  - id: amz_b8
    text: "Orchestrated idempotent GPU/CPU jobs across Modal, Lightning AI (H100/A100) and AWS SageMaker with S3 handoffs, checkpointing and a cost ledger; final submission reproduces byte-for-byte."
    fact_ids: [amz_infra]
  - id: amz_b9
    text: "Traced all 4,507 unrecoverable validation matches, showing that retrieval was effectively solved (only 10 misses) and that more than 50% of the remaining errors could not be resolved from the data itself."
    fact_ids: [amz_error_analysis]

interview:
  - {q: "Why F0.5 and how did it change your decisions?", a: "Precision weighted 2x; one false merge can zero an entity -> decision layer, ambiguity drops."}
  - {q: "What was the val-test gap and how did you close it?", a: "Orphan simulation (+0.0043)."}
  - {q: "What would you do with more time?", a: "Error analysis says >50% of residuals are unresolvable from data; only 10 retrieval misses."}
  - {q: "What did you do vs your teammate?", a: "Have a precise answer ready."}
