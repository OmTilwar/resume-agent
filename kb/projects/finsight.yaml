titles:
  - {subtitle: "LLM Banking Assistant with Hybrid RAG", stack: [Python, FastAPI, Llama-3, Pinecone, BM25]}
  - {subtitle: "Local LLM Agent & Function-Calling", stack: [Python, FastAPI, Llama-3, Pinecone]}
  - {subtitle: "Hybrid Retrieval Pipeline (BM25 + Vector Search)", stack: [Python, FastAPI, Pinecone, BM25]}
  - {subtitle: "Full-Stack AI Banking Assistant", stack: [React, Python, FastAPI, Llama-3, Pinecone]}

bullets:
  - id: fs_b1
    text: "Built a privacy-first banking assistant on a local Llama-3-8B (GGUF, llama.cpp) with a 4-stage pipeline: BM25 lexical search → Pinecone vector search → deterministic function-calling → grounded generation."
    fact_ids: [fs_arch, fs_llm]
  - id: fs_b2
    text: "Benchmarked lexical retrievers on 762 banking queries, replacing TF-IDF with BM25 to raise Top-1 accuracy from 60.53% to 66.45% (+5.92 pts) and Top-3 from 78.29% to 83.55%."
    fact_ids: [fs_retrieval_bench]
  - id: fs_b3
    text: "Implemented deterministic function-calling for structured account queries (balance checks, loan eligibility) so numeric answers come from tools rather than LLM generation."
    fact_ids: [fs_tools]
  - id: fs_b4
    text: "Tuned per-retriever confidence thresholds (TF-IDF 0.65, Pinecone 0.55) to route queries between strict keyword matching and semantic fallback; served via FastAPI with JSON validation."
    fact_ids: [fs_thresholds, fs_api]
  - id: fs_b5
    text: "Built the full stack: a React (Vite) frontend with voice input and a FastAPI backend serving local Llama-3."
    fact_ids: [fs_api, fs_llm]
  - id: fs_b6
    text: "Fine-tuned Llama-3 with LoRA (Unsloth) on 150+ banking Q&A pairs for domain-specific phrasing."
    fact_ids: [fs_lora]
    note: "Use only as a 4th bullet; small dataset."

interview:
  - {q: "How is the 762-query benchmark built, and what counts as a correct Top-1?", a: "Know backend/benchmark_retrievers.py."}
  - {q: "Why BM25 + Pinecone instead of one? How are the thresholds chosen?"}
  - {q: "How do you know the LLM doesn't hallucinate?", a: "Numeric answers come from deterministic tools; full generation eval is Fix 3."}
