# Kit §7.5
id: authnet
name: "AuthNet"
tier: 1
section: "7.5"
github: "https://github.com/OmTilwar/authnet"
stack: [Python, PyTorch, pytorch-metric-learning, ONNX, ONNX Runtime, FastAPI]
one_liner: "Deep metric learning for texture-level visual fingerprinting, prototyped on the DTD texture benchmark as a proxy for product authentication (Entrupy-inspired)."
tags: [ml, computer-vision, embeddings, metric-learning, representation-learning, visual-search, similarity-search, retrieval, authentication, entrupy, onnx, quantization, edge, grad-cam, fastapi]
rules:
  - "DTD is a public texture dataset, not counterfeit data: say 'texture fingerprinting' / 'authentication prototype'."
  - "Never 'developed new algorithms' / 'novel' for Multi-Similarity Loss + miner (standard library components)."
forbidden_title_terms: ["Record Linkage", "Entity Matching", "Statistical Modelling", "Analytical Dataset"]
banned_terms: ["authenticated products", "detected counterfeits", "counterfeit detection", "analytical datasets", "31x"]

facts:
  - {id: an_dataset, claim: "DTD: 47 classes; 1,880 test samples", values: ["47", "1,880"], status: verified, source: "outputs/evaluation_results.json"}
  - id: an_recall
    claim: "Recall@1 64.5% (64.52%) — ~30x above the 2.1% random baseline (1/47); Recall@2/4/8: 73.88% / 80.16% / 84.10%"
    values: ["64.5", "64.52", "30", "2.1", "73.88", "80.16", "84.10"]
    status: verified
    eval_size: 1880
    source: "outputs/evaluation_results.json"
  - {id: an_map, claim: "mAP 48.97%", values: ["48.97"], status: verified, eval_size: 1880}
  - {id: an_map_rounded, claim: "mAP 49% (rounded)", values: ["49"], status: verified, eval_size: 1880, allowed_when: {company_contains: [entrupy]}}
  - {id: an_nmi, claim: "NMI 0.70", values: ["0.70"], status: verified, eval_size: 1880}
  - {id: an_backbone, claim: "ResNet-18 backbone, 128-dim L2-normalized embeddings", values: ["128"], status: stated}
  - {id: an_loss, claim: "Multi-Similarity Loss (alpha=2, beta=50), MultiSimilarityMiner, MPerClassSampler (8/class); 40 epochs, ~25 min on RTX 4050", values: ["2", "50", "8", "40", "25", "4050"], status: stated}
  - {id: an_onnx, claim: "ONNX INT8: 43.3 MB -> 10.9 MB (4x compression), max output diff 7.45e-08", values: ["43.3", "10.9", "4", "7.45e-08"], status: stated}
  - {id: an_latency, claim: "Inference 2.4ms median GPU (RTX 4050); CPU 8ms (ONNX INT8) vs 14.78ms (PyTorch)", values: ["2.4", "8", "14.78", "4050"], status: stated}
  - {id: an_api, claim: "FastAPI endpoints /authenticate, /fingerprint, /explain, /health; gallery retrieval + pairwise verification", values: [], status: verified}
  - {id: an_gradcam, claim: "Custom Grad-CAM target for embedding similarity; t-SNE cluster visualization", values: [], status: verified}
  - {id: an_tests, claim: "26 unit and integration tests", values: ["26"], status: verified}

titles:
  - {subtitle: "Texture-Level Visual Fingerprinting for Authentication", stack: [Python, PyTorch, ONNX, FastAPI]}
  - {subtitle: "Deep Metric Learning & Embeddings", stack: [Python, PyTorch, ONNX, FastAPI]}
  - {subtitle: "Visual Similarity Search & Verification API", stack: [Python, PyTorch, ONNX, FastAPI]}
  - {subtitle: "Embedding Model with ONNX INT8 Optimisation", stack: [Python, PyTorch, ONNX Runtime]}

bullets:
  - id: an_b1
    text: "Trained a ResNet-18 metric-learning model (Multi-Similarity Loss + hard-negative mining) producing 128-dim texture fingerprints, reaching 64.5% Recall@1 (~30x random) and 48.97% mAP on 47 DTD classes."
    fact_ids: [an_backbone, an_recall, an_map, an_dataset]
  - id: an_b2
    text: "Quantized the model with ONNX INT8 (43.3 MB → 10.9 MB, 4x smaller) with negligible output drift, cutting CPU inference from 14.78ms to 8ms; 2.4ms median on GPU."
    fact_ids: [an_onnx, an_latency]
  - id: an_b3
    text: "Built gallery-based retrieval and pairwise verification behind a FastAPI service (/authenticate, /fingerprint, /explain), covered by 26 unit and integration tests."
    fact_ids: [an_api, an_tests]
  - id: an_b4
    text: "Adapted Grad-CAM to embedding-similarity models to show which texture regions drive a match, and validated cluster separation with t-SNE (NMI 0.70)."
    fact_ids: [an_gradcam, an_nmi]

interview:
  - {q: "Why is DTD a reasonable proxy for authentication, and what are its limits?", a: "Texture classes != genuine/counterfeit pairs; say so."}
  - {q: "Why Multi-Similarity Loss over triplet/contrastive?"}
  - {q: "How did you verify INT8 didn't hurt retrieval quality?", a: "Max output diff 7.45e-08; re-run Recall@1 on the INT8 model if not done."}
