# LLM routing via OpenRouter (OpenAI-compatible API).
# Chosen by measurement on 2026-11-04 (see bench/results and the trial notes below).
#
# Hybrid on purpose:
#   - writing roles use a cheap, fast PAID model (~8-10 s/call, ~$0.01 per resume),
#   - the judge stays on the model the seeded benchmark validated (free, same-model
#     paid endpoint as fallback), because cheap judges measured far worse.
#
# Each role: primary + fallbacks (OpenRouter tries them in order).
# structured: function_calling everywhere — every model in these chains supports tools,
# and the free judge model does not support json_schema mode.
#
# Trial, 4 Nov 2026 (real project prompts, same JD):
#   writer   mistral-small-3.2-24b  8-10 s/call, all bullets pass truth checks
#            deepseek-v4-flash      61-92 s/call (reasoning), all pass
#            glm-5.3-flash          3-175 s/call, erratic
#            qwen3.5-flash          structured-output errors
#            inkling:free           403 — now only available to partner apps
#   judge    (96 seeded items, rules + judge)  catch / false-flag rate
#            nemotron-3-ultra       98.6% / 0.0%
#            mistral-small-3.2      84.7% / 8.3%
#            gpt-oss-120b           84.7% / 12.5%
#            gpt-5-nano             83.3% / 4.2%
#
# Re-check availability: python scripts/list_free_models.py --check

base_url: "https://openrouter.ai/api/v1"
app_name: "resume-agent"

roles:
  analyzer:
    model: "mistralai/mistral-small-3.2-24b-instruct"
    fallbacks: ["deepseek/deepseek-v4-flash", "nvidia/nemotron-3.5-super-vl:free"]
    structured: function_calling
    temperature: 0.0

  writer:
    model: "mistralai/mistral-small-3.2-24b-instruct"
    fallbacks: ["deepseek/deepseek-v4-flash", "nvidia/nemotron-3-ultra-550b-a55b:free"]
    structured: function_calling
    temperature: 0.4

  fixer:
    model: "mistralai/mistral-small-3.2-24b-instruct"
    fallbacks: ["deepseek/deepseek-v4-flash", "nvidia/nemotron-3-ultra-550b-a55b:free"]
    structured: function_calling
    temperature: 0.1

  # Benchmark-validated judge. Keep the fallback the SAME model so results stay attributable.
  judge:
    model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    fallbacks: ["nvidia/nemotron-3-ultra-550b-a55b"]
    structured: function_calling
    temperature: 0.0

  fast:
    model: "mistralai/mistral-small-3.2-24b-instruct"
    fallbacks: ["google/gemma-4-26b-a4b-it", "nvidia/nemotron-3.5-lightning:free"]
    structured: function_calling
    temperature: 0.0
