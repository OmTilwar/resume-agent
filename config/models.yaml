# LLM routing via OpenRouter (OpenAI-compatible API).
# Chosen by measurement on 2026-11-04 (see bench/results and the trial notes below).
#
# Hybrid on purpose:
#   - writing roles use a cheap, fast PAID model (~8-10 s/call, ~$0.01 per resume),
#   - the judge stays on the model the seeded benchmark validated (free, same-model
#     paid endpoint as fallback), because cheap judges measured far worse.
#
# Each role: primary + fallbacks (OpenRouter tries them in order).
# structured: json_schema for the writing roles (mistral-small + fallbacks all support it; with
# function_calling mistral-small returned no tool call for the larger ProjectDraft schema — live run,
# 4 Nov 2026). The judge uses function_calling, as benchmarked (the free endpoint has no json_schema).
#
# Trial, 4 Nov 2026 (real project prompts, same JD):
#   writer   mistral-small-3.2-24b  8-10 s/call, all bullets pass truth checks
#            deepseek-v4-flash      61-92 s/call (reasoning), all pass
#            glm-5.3-flash          3-175 s/call, erratic
#            qwen3.5-flash          structured-output errors
#            inkling:free           403 — now only available to partner apps
#   judge    (96 seeded items, rules + judge)  catch / false-flag rate
#            nemotron-3-ultra       98.6% / 0.0%
#            mistral-small-3.2      84.7% / 8.3%
#            gpt-oss-120b           84.7% / 12.5%
#            gpt-5-nano             83.3% / 4.2%
#
# max_tokens: caps each role's output. A skills call once ran away to 16,384 tokens (~8 min,
# twice) and stalled the whole run at the fan-in; typical outputs are 300-1,500 tokens.
#
# Fallbacks are NON-reasoning models: a reasoning model's hidden thinking tokens count against
# max_tokens, so deepseek-v4-flash failed every retry at the 2,000 cap (live run, 4 Nov).
# Retry trial (authnet/medvision/amazon_er, x2): gpt-4.1-nano 2-11 s, 1/18 bullets fail truth checks;
# ministral-8b 7-22 s, 2/18 fail. mistral-small ran away on 3 of 8 first attempts in one live run.
#
# Re-check availability: python scripts/list_free_models.py --check

base_url: "https://openrouter.ai/api/v1"
app_name: "resume-agent"

roles:
  analyzer:
    model: "mistralai/mistral-small-3.2-24b-instruct"
    fallbacks: ["openai/gpt-4.1-nano", "mistralai/ministral-8b-2512"]
    structured: json_schema
    temperature: 0.0
    max_tokens: 1500

  writer:
    model: "mistralai/mistral-small-3.2-24b-instruct"
    fallbacks: ["openai/gpt-4.1-nano", "mistralai/ministral-8b-2512"]
    structured: json_schema
    temperature: 0.3
    max_tokens: 1200

  fixer:
    model: "mistralai/mistral-small-3.2-24b-instruct"
    fallbacks: ["openai/gpt-4.1-nano", "mistralai/ministral-8b-2512"]
    structured: json_schema
    temperature: 0.1
    max_tokens: 4000

  # Benchmark-validated judge. Keep the fallback the SAME model so results stay attributable.
  judge:
    model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    fallbacks: ["nvidia/nemotron-3-ultra-550b-a55b"]
    structured: function_calling
    temperature: 0.0
    max_tokens: 12000

  fast:
    model: "mistralai/mistral-small-3.2-24b-instruct"
    fallbacks: ["openai/gpt-4.1-nano", "mistralai/ministral-8b-2512"]
    structured: json_schema
    temperature: 0.0
    max_tokens: 1500
